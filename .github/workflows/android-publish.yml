name: Android Play beta publication
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android release artifacts run ID
        required: true
        type: string
      status:
        description: Check access, save a draft, or publish to internal testers
        type: choice
        options: [check, draft, completed]
        default: check
      release_notes:
        description: English beta release notes (1–500 characters)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-play-beta-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.source }}
      version_code: ${{ steps.source.outputs.version_code }}
      version_name: ${{ steps.source.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_android_publishing.py'
      - name: Verify artifact provenance and passing exact-source checks
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: python3 scripts/verify_android_release.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-play-beta
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: yepcontrol-play-${{ needs.verify.outputs.version_code }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate checksum and receipt before Google authentication
        env:
          SOURCE: ${{ needs.verify.outputs.source }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          VERSION_CODE: ${{ needs.verify.outputs.version_code }}
          VERSION_NAME: ${{ needs.verify.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish_android_bundle import verify_candidate
          verify_candidate(Path(os.environ['RUNNER_TEMP']) / 'candidate', os.environ['SOURCE'], os.environ['BUILD_RUN'], os.environ['VERSION_CODE'], os.environ['VERSION_NAME'])
          PY
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: google
        with:
          workload_identity_provider: ${{ vars.ANDROID_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and commit this verified candidate to internal testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SOURCE: ${{ needs.verify.outputs.source }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          VERSION_CODE: ${{ needs.verify.outputs.version_code }}
          VERSION_NAME: ${{ needs.verify.outputs.version_name }}
          STATUS: ${{ inputs.status }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          python3 scripts/publish_android_bundle.py "$RUNNER_TEMP/candidate" --source "$SOURCE" --run-id "$BUILD_RUN" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" --track internal --status "$STATUS" --notes-file "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/candidate/publication.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: play-beta-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/publication.json
          if-no-files-found: ignore
