name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_origin:
        description: Optional HTTPS development relay origin for hosted acceptance
        required: false
        type: string
      control_acceptance:
        description: Also run owned-emulator viewing, video, gestures and synthetic unlock
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache: false
      - name: Scan complete history with reviewed public-fixture exceptions
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --redact --log-opts=--all
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: python3 -m unittest discover -s scripts -p 'test_android_publishing.py'
      - run: python3 -m unittest discover -s scripts -p 'test_relay_release.py'
      - run: pnpm build:android
      - run: npm --prefix spike ci --ignore-scripts
      - run: pnpm test:spike
  cloudflare-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: pnpm --dir experiments/cloudflare-relay install --frozen-lockfile
      - run: pnpm --dir experiments/cloudflare-relay typecheck
      - run: pnpm --dir experiments/cloudflare-relay test
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Ubuntu archive for browser dependencies
        # The Azure mirror can spend the entire job downloading a few fonts.
        # Hosted images may reference mirror+file: instead of inline URLs.
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:public-site
      - run: pnpm test:viewer-layout
      - run: pnpm test:viewer-phones
  browser-android-interop:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/emulator-smoke.yml

  hosted-pairing-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_origin != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Build APKs pinned to the acceptance service
        run: ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest "-PsharingWebsite=$HOSTED_ORIGIN"
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
      - run: pnpm test:hosted
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
      - name: Encrypted hosted control acceptance
        if: inputs.control_acceptance
        run: pnpm exec tsx scripts/hosted-acceptance.ts --control
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
          HOSTED_CLI: '1'
          HOSTED_TOUCH: '1'
          HOSTED_UNLOCK: '1'
          HOSTED_VIDEO: '1'
          HOSTED_ROTATION: '1'
