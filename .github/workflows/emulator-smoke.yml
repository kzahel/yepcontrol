name: Android emulator smoke
on:
  workflow_call:
    inputs:
      hosted_origin:
        description: Optional development relay for release pairing, FCM and control acceptance
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      hosted_origin:
        description: Optional HTTPS development relay origin for full release acceptance
        required: false
        default: ''
        type: string
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' 'emulator'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Enable KVM for owned emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - name: Use Ubuntu archive for browser dependencies
        # The Azure mirror can spend the entire job downloading a few fonts.
        # Hosted images may reference mirror+file: instead of inline URLs.
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Build APKs pinned to the configured acceptance service
        run: ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest "-PsharingWebsite=${HOSTED_ORIGIN:-https://yepcontrol.com}"
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
      # Each harness refuses occupied selectors and owns/reaps its emulator.
      - run: pnpm test:interop
      - run: pnpm test:mobile-smoke
      - name: Hosted pairing and process-absent FCM wake
        if: inputs.hosted_origin != ''
        run: pnpm test:hosted
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
          HOSTED_FCM: '1'
      - name: Phone-first QR and existing browser-first pairing
        if: inputs.hosted_origin != ''
        run: pnpm exec tsx scripts/hosted-acceptance.ts --pairing-only
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          HOSTED_VERIFY_APP_LINKS: '0'
      # Credential/reboot qualification remains a separate owned-emulator run.
      - name: Hosted encrypted control smoke acceptance
        if: inputs.hosted_origin != ''
        run: pnpm exec tsx scripts/hosted-acceptance.ts --control
        env:
          HOSTED_ORIGIN: ${{ inputs.hosted_origin }}
          # The runner-generated debug key is not a public domain-associated signer.
          HOSTED_VERIFY_APP_LINKS: '0'
          HOSTED_TOUCH: '1'
          HOSTED_VIDEO: '1'
          # Software H.264 and held input are measured in sequence on shared runners.
          HOSTED_SERIAL_VIDEO: '1'
          HOSTED_ROTATION: '1'
      # Logs, QR material and app data stay private; do not upload .local/.
