name: Android release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  acceptance-config:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the designated development acceptance relay
        env:
          HOSTED_ORIGIN: ${{ vars.HOSTED_ACCEPTANCE_ORIGIN }}
        run: test -n "$HOSTED_ORIGIN"
  emulator-smoke:
    if: github.ref == 'refs/heads/main'
    needs: acceptance-config
    uses: ./.github/workflows/emulator-smoke.yml
    with:
      hosted_origin: ${{ vars.HOSTED_ACCEPTANCE_ORIGIN }}
  build:
    needs: emulator-smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.source.outputs.version_code }}
      version_name: ${{ steps.source.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require passing exact-source checks and tracked version
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_android_release.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: pnpm install --frozen-lockfile
      - name: Verify publication regressions and build the real release variant
        run: |
          python3 -m unittest discover -s scripts -p 'test_android_publishing.py'
          ./android/gradlew -p android :app:lintRelease :app:bundleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 2
          if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Sign, verify and receipt the exact built bytes
        env:
          UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          YEPCONTROL_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          YEPCONTROL_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          YEPCONTROL_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.p12
          RELEASE_CODE: ${{ needs.build.outputs.version_code }}
          RELEASE_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ['UPLOAD_KEY']
          if not raw:
              raise SystemExit('Missing project upload key')
          Path(os.environ['YEPCONTROL_UPLOAD_KEYSTORE']).write_bytes(base64.b64decode(raw, validate=True))
          PY
          bash scripts/sign_android_bundle.sh "$RUNNER_TEMP/unsigned/app-release.aab" "$RUNNER_TEMP/signed/yepcontrol.aab"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {key: os.environ[key] for key in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'RELEASE_CODE', 'RELEASE_NAME')}
          Path(os.environ['RUNNER_TEMP'], 'signed', 'build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Remove private upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yepcontrol-play-${{ needs.build.outputs.version_code }}
          path: ${{ runner.temp }}/signed/
          retention-days: 14
          if-no-files-found: error
