name: Relay release and deployment
on:
  push:
    tags: ['relay-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing relay-vMAJOR.MINOR.PATCH tag with passing main checks
        required: true
        type: string
      deploy:
        description: Deploy to the selected relay environment
        type: boolean
        default: false
      target:
        description: Isolated deployment environment
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
  actions: read
concurrency:
  group: relay-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source: ${{ steps.source.outputs.source }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require versioned, checked main source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/relay_release.py source --tag "$RELEASE_TAG"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test:ts
      - run: python3 -m unittest discover -s scripts -p 'test_relay_release.py'
      - run: pnpm --dir experiments/cloudflare-relay install --frozen-lockfile
      - run: pnpm --dir experiments/cloudflare-relay typecheck
      - run: pnpm --dir experiments/cloudflare-relay test
      - name: Build the matched viewer and receipt the bundle
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_SOURCE: ${{ steps.source.outputs.source }}
        run: |
          pnpm --filter @remote/web build
          mkdir -p .local/relay-release/web
          cp experiments/cloudflare-relay/.local/bundle/worker.js .local/relay-release/worker.js
          cp experiments/cloudflare-relay/.local/migration-bundle/migration-worker.js .local/relay-release/importer.js
          cp -R web/dist/. .local/relay-release/web/
          python3 scripts/relay_release.py receipt --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --directory .local/relay-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-${{ steps.source.outputs.version }}-${{ steps.source.outputs.source }}
          path: .local/relay-release/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: relay-${{ inputs.target }}
    concurrency:
      group: relay-${{ inputs.target }}-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: relay-${{ needs.build.outputs.version }}-${{ needs.build.outputs.source }}
          path: .local/relay-release
      - name: Verify exact built bytes before deployment credentials
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SOURCE: ${{ needs.build.outputs.source }}
        run: python3 scripts/relay_release.py verify --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --directory .local/relay-release
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: pnpm --dir experiments/cloudflare-relay install --frozen-lockfile
      - name: Deploy and verify the tagged revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_WORKER_NAME: ${{ vars.RELAY_WORKER_NAME }}
          RELAY_ORIGIN: ${{ vars.RELAY_ORIGIN }}
          FCM_PROJECT: ${{ vars.FCM_PROJECT }}
          RELAY_TARGET: ${{ inputs.target }}
          RELAY_MODE: ${{ vars.RELAY_MODE }}
          RELAY_HEALTH_ORIGIN: ${{ vars.RELAY_HEALTH_ORIGIN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SOURCE: ${{ needs.build.outputs.source }}
        run: python3 scripts/deploy_relay.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: relay-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/relay-deployment.json
          if-no-files-found: ignore
